[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Default coverage config — consumed by `python -m pytest --cov=app`
# in CI and by `make test` locally. Output path matches what
# sonar-project.properties expects.
addopts = "--cov=app/services --cov-fail-under=75 --cov-report=term-missing --cov-report=xml:coverage.xml"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/__init__.py",
    "app/seed/__init__.py",
    "migrations/*",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "I001", "UP017", "UP035"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
