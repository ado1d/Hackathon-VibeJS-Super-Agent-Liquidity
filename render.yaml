# Render Blueprint for the public synthetic-data demo.
# Deploy this branch, enter OPENAI_API_KEY when prompted, then replace the
# frontend BACKEND_URL placeholder with the backend's generated public URL.

databases:
  - name: super-agent-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: super_agent
    user: super_agent
    ipAllowList: []

services:
  - type: web
    name: super-agent-backend
    runtime: docker
    plan: free
    region: singapore
    branch: vercel-openai-zip-implementation
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: super-agent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      # Browser traffic normally reaches the API through the frontend proxy.
      # Replace this placeholder with the frontend origin if you also call the
      # backend directly from a browser.
      - key: CORS_ORIGINS
        value: https://placeholder.invalid
      - key: AI_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: AI_MAX_OUTPUT_TOKENS
        value: "500"
      - key: AI_TIMEOUT_SECONDS
        value: "12"
      - key: AI_CACHE_TTL_MINUTES
        value: "60"
      - key: AI_INPUT_COST_PER_MILLION
        value: "0.75"
      - key: AI_OUTPUT_COST_PER_MILLION
        value: "4.50"
      - key: AI_PRICING_VERSION
        value: openai-gpt-5.4-mini-2026-07-11
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_STORAGE_URI
        value: memory://
      - key: RATE_LIMIT_TRUST_PROXY_HEADERS
        value: "true"
      - key: VALIDATION_DATA_DIR
        value: /app/data/validation
      - key: COMMIT_IDENTIFIER
        value: vercel-openai-zip-implementation

  - type: web
    name: super-agent-frontend
    runtime: docker
    plan: free
    region: singapore
    branch: vercel-openai-zip-implementation
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE
        value: /api/v1
      # Render cannot interpolate another free web service's public URL in a
      # Blueprint. Replace this after the backend receives its onrender.com URL.
      - key: BACKEND_URL
        value: https://placeholder.invalid
