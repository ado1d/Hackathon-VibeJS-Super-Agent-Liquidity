# ============================================================
# SonarCloud project configuration
# ============================================================
# This file is read by the SonarSource/sonarcloud-scan-action
# in .github/workflows/sonar.yml on every push and pull request.
#
# Setup steps: see docs/sonarqube-setup.md
# ============================================================

# Project identity — must match the project key you created in SonarCloud.
# If you imported the repo via the SonarCloud GitHub App, these values are
# filled in automatically and you should not change them.
sonar.projectKey=ado1d_Hackathon-VibeJS-Super-Agent-Liquidity
sonar.organization=ado1d
sonar.projectName=Hackathon-VibeJS-Super-Agent-Liquidity
sonar.projectVersion=1.0

# Source directories (production code only — tests are declared separately
# so SonarCloud knows which files to analyse for issues vs. coverage).
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src

# Test file globs — used to keep test files out of issue scanning but
# include them in coverage measurement.
sonar.test.inclusions=**/*.test.tsx,**/*.test.ts,backend/tests/**/*.py

# Language versions
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Files that should NOT count toward coverage (tests themselves, migrations,
# seeds, generated code). Coverage on these is misleading.
sonar.coverage.exclusions=\
  **/__init__.py,\
  backend/migrations/**,\
  backend/tests/**,\
  backend/app/seed/**,\
  **/*.test.tsx,\
  **/*.test.ts,\
  frontend/src/main.tsx,\
  frontend/src/vite-env.d.ts

# Files that should NOT be scanned at all (build output, deps, env).
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/dist/**,\
  **/build/**,\
  **/__pycache__/**,\
  **/coverage/**,\
  **/*.config.ts,\
  **/*.config.js

# Duplication exclusions — models and schemas are deliberately repetitive
# (one field per line, similar across tables) and would inflate the
# duplication metric without indicating a real problem.
sonar.cpd.exclusions=\
  backend/app/models.py,\
  backend/app/enums.py,\
  backend/app/schemas.py

# Encoding
sonar.sourceEncoding=UTF-8

# Links back to GitHub from the SonarCloud dashboard
sonar.links.homepage=https://github.com/ado1d/Hackathon-VibeJS-Super-Agent-Liquidity
sonar.links.scm=https://github.com/ado1d/Hackathon-VibeJS-Super-Agent-Liquidity
sonar.links.issue=https://github.com/ado1d/Hackathon-VibeJS-Super-Agent-Liquidity/issues
